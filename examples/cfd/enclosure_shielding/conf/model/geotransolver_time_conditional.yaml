# conf/model/default.yaml
_target_: rollout.GeoTransolverTimeConditionalEField
_convert_: all

# functional_dim = 3 (coords) + 1 (|E|_0) + 1 (time) = 5
functional_dim: 5
# out_dim = Fo = 1 (scalar |E| at single timestep)
out_dim: 1
geometry_dim: 3
═══════════════════════════════════════════════════════════════════════════════
# Global Dimension (must match datapipe encoding)
# ═══════════════════════════════════════════════════════════════════════════════
#
# `global_dim` = sum of encoded feature widths for all keys in
# `global_params_keys`, following these rules:
#
#     type="angle_deg"  or  type="angle_rad"  →  2 features
#     type="scale"      or  type="log_scale"  →  1 feature
#
# For the default configuration (wave_azimuth + wave_elevation + frequency_ghz):
#     2 (azimuth) + 2 (elevation) + 1 (frequency) = 5
#
# ─── How to DISABLE global parameters ───────────────────────────────────────
#
# If `global_params_keys: []` is set in the datapipe config, set:
#
#     global_dim: null
#
# This disables the GlobalContextBuilder in GeoTransolver and the model
# will train using only local (per-point) and geometry features.

global_dim: 5              # 2 + 2 + 1  (must match datapipe global_params config)

# ── Fourier features ──
use_fourier: true
fourier_num_freqs: 6             # L = 6 bands: π, 2π, 4π, 8π, 16π, 32π
fourier_mode: "dyadic"           # Deterministic, no random seed
fourier_include_input: true      # Keep original coords alongside sin/cos features
fourier_on_geometry: false       # Apply only to field coords, not STL

# Architecture
slice_num: 128
n_layers: 12
n_hidden: 256
n_head: 8
use_te: false
time_input: false
include_local_features: true

### Time-conditional parameters ###
num_time_steps: ${training.num_time_steps}
dt: 5e-3

