# conf/model/default.yaml
_target_: rollout.GeoTransolverOneShotEField
_convert_: all

# functional_dim = 3 (coords) + 1 (|E|_0) = 4
functional_dim: 4
# out_dim = (num_time_steps - 1) * Fo = (T-1) * 1
out_dim: ${training.num_time_steps}  # Hydra resolves to e.g. 10; code uses T-1 of it
geometry_dim: 3
slice_num: 128
n_layers: 8
n_hidden: 256
n_head: 8
use_te: false
time_input: false
include_local_features: true

### One-shot parameters ###
num_time_steps: ${training.num_time_steps}
dt: 5e-3

